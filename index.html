<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 첫 웹사이트</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #151528;
      color: white;
      font-family: system-ui, sans-serif;
      transition: background 0.4s;
    }

    main {
      width: min(90%, 420px);
      padding: 45px 25px;
      text-align: center;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
    }

    h1 { font-size: 30px; }
    p { line-height: 1.7; }

    button {
      margin-top: 15px;
      padding: 15px 28px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #151528;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <h1>내 첫 웹사이트 🚀</h1>
    <p>버튼을 눌러 배경색을 바꿔 봐!</p>
    <button id="change">색깔 바꾸기 🎨</button>
    <p id="count" aria-live="polite">지금까지 0번 눌렀어</p>
  </main>

  <script>
    let count = 0;

    document.querySelector("#change").addEventListener("click", () => {
      const hue = Math.floor(Math.random() * 360);
      document.body.style.background = `hsl(${hue}, 55%, 28%)`;

      count++;
      document.querySelector("#count").textContent =
        `지금까지 ${count}번 눌렀어`;
    });
  </script>
</body>
</html>
